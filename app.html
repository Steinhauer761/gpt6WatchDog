<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070a0f">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="app-icon.svg" type="image/svg+xml">
  <title>Field Tools</title>
  <style>
    html,body{margin:0;min-height:100%;background:#070a0f;color:#f5f7fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
    .box{max-width:360px}
    .icon{width:92px;height:92px;margin:0 auto 18px}
    h1{font-size:21px;margin:0 0 8px}p{font-size:13px;color:#9ba8b6;line-height:1.5}
  </style>
</head>
<body>
<main><div class="box"><img class="icon" src="app-icon.svg" alt=""><h1>Field Tools</h1><p>Starting secure console…</p></div></main>
<script>
(async()=>{
  try {
    if ('serviceWorker' in navigator) await navigator.serviceWorker.register('./service-worker.js', {scope:'./'});
  } catch (e) { console.warn('Service worker registration failed', e); }
  window.location.replace('./index.html');
})();
</script>
</body>
</html>
