<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <title>Astra Core: Cyber OSINT & Geo Tracer</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-color: #1f2833;
            --accent-color: #c5a059;
            --threat-color: #ff4d4d;
            --osint-color: #00d2d3;
            --trace-color: #f1c40f;
            --text-main: #ffffff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; min-height: 100vh; }
        .app-container { max-width: 500px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid #2f3e46; }
        header h1 { font-size: 20px; letter-spacing: 1px; }
        header p { font-size: 11px; color: var(--accent-color); text-transform: uppercase; margin-top: 5px; }
        .section-title { font-size: 13px; text-transform: uppercase; color: var(--accent-color); margin-bottom: 12px; letter-spacing: 0.5px; }
        .control-group { background: var(--card-color); padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #2c3540; }
        label { display: block; font-size: 12px; margin-bottom: 6px; color: #a4b0be; }
        select, input, textarea { width: 100%; background: #151c24; border: 1px solid #34495e; padding: 12px; border-radius: 8px; color: white; font-size: 14px; margin-bottom: 12px; }
        select:focus, input:focus { border-color: var(--accent-color); outline: none; }
        .btn { width: 100%; background: var(--accent-color); color: #0b0c10; border: none; padding: 14px; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; margin-bottom: 10px; }
        .btn-threat { background: var(--threat-color); color: white; }
        .btn-osint { background: var(--osint-color); color: #0b0c10; }
        .btn-trace { background: var(--trace-color); color: #0b0c10; }
        .output-box { background: #11161d; border-left: 4px solid var(--accent-color); padding: 15px; border-radius: 4px; margin-top: 15px; display: none; }
        .prompt-text { font-size: 13px; line-height: 1.5; color: #dcdde1; background: #090d12; padding: 10px; border-radius: 6px; border: 1px solid #2c3540; word-break: break-word; white-space: pre-wrap; }
        .link-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .link-btn { display: block; text-align: center; background: #2f3542; color: white; padding: 10px; border-radius: 6px; text-decoration: none; font-size: 11px; font-weight: bold; border: 1px solid #3e4452; }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>ASTRA OPERATIONS CENTER</h1>
        <p>Studio, Free Country Tracer & OSINT Portal</p>
    </header>

    <!-- 1. STUDIO COMPONENT -->
    <div class="control-group">
        <h2 class="section-title">🎬 Video Asset Prompt Engine</h2>
        <label for="themeSelect">Atmosphere Theme</label>
        <select id="themeSelect">
            <option value="Dark Gothic Luxury Lounge">Dark Gothic Luxury Lounge</option>
            <option value="Neon Cyberpunk Sanctum">Neon Cyberpunk Sanctum</option>
        </select>
        <button class="btn" onclick="generateVideoPrompts()">Compile Video Prompts</button>
    </div>

    <!-- 2. LIVE COUNTRY GEOLOCATION TRACER -->
    <div class="control-group" style="border-color: var(--trace-color);">
        <h2 class="section-title" style="color: var(--trace-color);">🌐 Free Country Origin Tracer</h2>
        <label for="ipInput">Suspect IP Address</label>
        <input type="text" id="ipInput" placeholder="Paste IP address here (e.g., 8.8.8.8)...">
        <button class="btn btn-trace" onclick="traceIPCountry()">Query Country Destination</button>
    </div>

    <!-- 3. OSINT DEEP FOOTPRINT SEARCH MATRIX -->
    <div class="control-group" style="border-color: var(--osint-color);">
        <h2 class="section-title" style="color: var(--osint-color);">🔍 Footprint Audit (Self & Others)</h2>
        <label for="investigateInput">Target Profile (Full Name, Handle, or Core Text)</label>
        <input type="text" id="investigateInput" placeholder="Type a name or alias to clean/verify...">
        <button class="btn btn-osint" onclick="launchOSINTMatrix()">Compile Deep Search Matrix</button>
    </div>

    <!-- 4. CENTRAL CONSOLE OUTPUT -->
    <div id="consoleBox" class="output-box">
        <h2 class="section-title" id="consoleHeader">Console Output</h2>
        <div id="consoleContent"></div>
    </div>
</div>

<script>
    function escapeHtml(value) {
        return value.replace(/[&<>'"]/g, (char) => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            "'": '&#39;',
            '"': '&quot;'
        })[char]);
    }

    function generateVideoPrompts() {
        const theme = document.getElementById('themeSelect').value;
        const out = document.getElementById('consoleBox');
        out.style.borderLeftColor = 'var(--accent-color)';
        document.getElementById('consoleHeader').innerText = "🎬 Generated Video Prompts";
        
        document.getElementById('consoleContent').innerHTML = `
            <div class="prompt-text"><strong>Scene 1 Prompt:</strong> Cinematic photorealistic opening shot, 8k resolution, ${escapeHtml(theme)} aesthetic. Heavy driving industrial beat sync cuts. Camera pans slowly.</div>
        `;
        out.style.display = 'block';
        out.scrollIntoView({ behavior: 'smooth' });
    }

    async function traceIPCountry() {
        const ip = document.getElementById('ipInput').value.trim();
        if(!ip) { alert("Please input an IP address to trace!"); return; }

        const out = document.getElementById('consoleBox');
        out.style.borderLeftColor = 'var(--trace-color)';
        document.getElementById('consoleHeader').innerText = "🌐 IP Geolocation Network Analysis";
        document.getElementById('consoleContent').innerHTML = "<p>Analyzing carrier data packages...</p>";
        out.style.display = 'block';

        try {
            const response = await fetch(`https://ipinfo.io/${encodeURIComponent(ip)}/json`);
            const data = await response.json();

            if(!response.ok || data.error || !data.country) {
                document.getElementById('consoleContent').innerHTML = `<div class="prompt-text" style="color: var(--threat-color)">Trace Routing Failed: Verify that the IP string format is valid or try again later.</div>`;
                return;
            }

            document.getElementById('consoleContent').innerHTML = `
                <div class="prompt-text">
<strong>[ROUTING STATUS]</strong>: HANDSHAKE SUCCESSFUL
<strong>[RESOLVED COUNTRY]</strong>: ${escapeHtml(String(data.country))}
<strong>[REGIONAL ZONE]</strong>: ${escapeHtml(String(data.region || 'UNMAPPED'))}
<strong>[NETWORK OWNER (ASN)]</strong>: ${escapeHtml(String(data.org || 'UNTRACKED'))}

<em>Security Note: IP geolocation identifies the apparent network exit point. VPNs, proxies, mobile carriers, hosting providers, and Tor can make that location different from the sender's real location.</em>
                </div>
            `;
        } catch (err) {
            document.getElementById('consoleContent').innerHTML = `<div class="prompt-text" style="color: var(--threat-color)">Connection Timeout: Network bridge closed.</div>`;
        }
        out.scrollIntoView({ behavior: 'smooth' });
    }

    function launchOSINTMatrix() {
        const query = document.getElementById('investigateInput').value.trim();
        if(!query) { alert("Please input a footprint verification target name!"); return; }

        const out = document.getElementById('consoleBox');
        out.style.borderLeftColor = 'var(--osint-color)';
        document.getElementById('consoleHeader').innerText = "🔎 Deep Footprint Exploration Grid";

        const safeQuery = escapeHtml(query);
        const dorkQuote = encodeURIComponent(`"${query}"`);
        const dorkPublicFiles = encodeURIComponent(`"${query}" (filetype:pdf OR filetype:doc OR filetype:docx)`);
        const dorkSocial = encodeURIComponent(`"${query}" (site:reddit.com OR site:x.com OR site:twitter.com)`);
        const ahmiaQuery = encodeURIComponent(query);

        document.getElementById('consoleContent').innerHTML = `
            <p style="font-size: 12px; margin-bottom: 12px; line-height: 1.4;">Active Parameters for: <strong>${safeQuery}</strong>. Select a search pathway for public mentions, indexed files, social posts, or Tor-indexed onion results:</p>
            
            <div class="link-grid">
                <a class="link-btn" href="https://www.google.com/search?q=${dorkQuote}" target="_blank" rel="noopener noreferrer">Exact Target Search 🚀</a>
                <a class="link-btn" href="https://www.google.com/search?q=${dorkPublicFiles}" target="_blank" rel="noopener noreferrer">Public Document Index</a>
                <a class="link-btn" href="https://www.google.com/search?q=${dorkSocial}" target="_blank" rel="noopener noreferrer">Social Mention Search</a>
                <a class="link-btn" href="https://ahmia.fi/search/?q=${ahmiaQuery}" target="_blank" rel="noopener noreferrer">Tor / Onion Index</a>
                <a class="link-btn" href="https://osintframework.com" target="_blank" rel="noopener noreferrer">OSINT Global Matrix</a>
            </div>
        `;
        out.style.display = 'block';
        out.scrollIntoView({ behavior: 'smooth' });
    }
</script>

</body>
</html>
