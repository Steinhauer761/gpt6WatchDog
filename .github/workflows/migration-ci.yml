name: Next + FastAPI migration CI

on:
  push:
    branches:
      - migration/next-fastapi
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'worker/**'
      - '.github/workflows/migration-ci.yml'

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      WATCHDOG_ADMIN_PASSWORD: ci-password
      WATCHDOG_SESSION_SECRET: ci-session-secret-at-least-32-characters
      WATCHDOG_ALLOWED_ORIGINS: http://localhost:3000
      WATCHDOG_AI_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m compileall -q backend worker
      - run: pytest -q backend/tests
      - name: Import FastAPI app
        run: python -c "from backend.app.main import app; print(app.title, app.version)"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package.json
      - run: npm install
      - run: npm run build
        env:
          NEXT_PUBLIC_WATCHDOG_API_URL: http://localhost:8000
